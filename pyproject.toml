[project]
name = "alphax_grc_maturity"
authors = [{ name = "IRSAA Business Solution", email = "grc.audit.assessment@irsaa.com" }]
description = "AlphaX GRC Maturity: assessment with global and profile-specific questions, weightage and white-label portal"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 130
target-version = "py310"
